# -*- coding: utf-8 -*-
# Template for hpc/sweep_au_cold.sh: the original a_u sweep's input
# (results/sweep_log_au=*/phys_input.ini) with three changes:
#   Theta0 5e-5 -> 5e-7: at a_u = 1.01 the sweep's Theta0 makes the collision barely
#     supersonic (inflow 0.55 cs, M ~1.4) and the shock heating only 0.17x the heat the
#     shells already carry; 5e-7 restores the a_u = 1.1 point's Mach number and ratio.
#   stop time (= shock) -> tstop: the shock stop relies on GAMMA's Sd flag, which never
#     fires below a_u ~ 1.1, and then reports a spurious crossing at it ~ 200.
#   u4 and tstop are placeholders, filled per point by the job script.

# Run information
mode        shells          # shells / MWN
runname     sweep_cold
rhoNorm     rho4
geometry    spherical       # cartesian / spherical

# Grid and sim parameters
Nsh1        500     # number of cells in shell 1
Next        20       # number of cells of external medium for each side
stop        tstop    # stop at lab time tstop, itmax only a backstop
tstop       @TSTOP@
itmax       5000000
itdump      50      # dump data file every itdump iterations

# Hydro parameters, in CGS
Theta0      5e-7      # shells relativistic temperature (sweep: 5e-5)
rhoContr    5e-2      # shells to external medium density contrast, default 5e-2
Ek1         1e52
u1          10
t1          0.5
Ek4         1e52
u4          @U4@
t4          0.5
toff        0.1

# Radiative parameters
chi_sh      0.01            # shock detection threshold

# microphysics parameters
psyn       2.5              # slope of electron distribution
eps_B      1/3              # fraction of int. energy in B field
eps_e      1/3              # fraction of int. energy in the acc e-
xi_e       1e-2             # accelerated electron fraction

# source parameters
z          1                # redshift
