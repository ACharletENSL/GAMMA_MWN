# -*- coding: utf-8 -*-
# @Author: acharlet

# Physical and grid parameters

# rhoNorm MUST be the name of a density of the system

# Run information
mode        shells          # shells / MWN
runname     cooling_g100
rhoNorm     rho4
geometry    spherical       # cartesian / spherical

# Grid and sim parameters
Nsh1        500     # number of cells in shell 1
Next        20       # number of cells of external medium for each side
stop        it       # stopping condition: it / shock / rarefaction / tstop ('time' = legacy alias for shock)
# stop = tstop also needs a 'tstop <lab seconds>' line: it matches paired runs on physical
# duration rather than iteration count (see results/cooling_g100_semi).
# pmatch 1 puts the ambient in pressure equilibrium with the shells (p_ext = p_shell,
# only rho scaled by rhoContr); default 0 is the historical coupled ambient. Needed for
# thin ambients -- coupled, rhoContr 5e-4 blasts the buffer at t=0 and collapses the
# timestep (see results/cooling_g100_p4 vs cooling_g100_c4_coupled).
itmax       850000  # max number of iterations
# dump cadence, three phases (see Shells.cpp): dense until the shock is established over
# PLATEAU_EFRAC of the shell, then itdump, then sparse once the rarefactions have converged.
# Omitting itdump_early/itdump_late falls back to itdump everywhere (uniform, as before).
itdump_early 5      # dump every itdump_early its while the shock sweeps the shell
itdump      50      # dump data file every itdump iterations
itdump_late 500     # dump every itdump_late its after rarefaction convergence

# Hydro parameters, in CGS
# For shells: (Ek or rho), (D0 or ton), u, (R0 or t0)
L           1e52      # central engine kinetic power
Theta0      5e-5      # shells relativistic temperature, default 5e-5
rhoContr    5e-2      # shells to external medium density contrast, default 5e-2
#Ek1         1e52
u1          100 
t1          1.
#Ek4         1e52
u4          200 
t4          1.
toff        1.

# Radiative parameters
chi_sh      0.01            # shock detection threshold

# microphysics parameters
psyn       2.5              # slope of electron distribution
eps_B      0.105413         # fraction of int. energy in B field (set so log10(gma_c/gma_m) = -3 exactly, no rescaling)
eps_e      1/3              # fraction of int. energy in the acc e-
xi_e       1e-2             # accelerated electron fraction

# source parameters
z          1                # redshift

