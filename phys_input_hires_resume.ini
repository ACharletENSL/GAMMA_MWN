# -*- coding: utf-8 -*-
# @Author: acharlet

# RESUME variant of phys_input_hires.ini. Use ONLY to continue an interrupted hi-res run
# (./bin/GAMMA -r), never to start one.
#
# Identical to phys_input_hires.ini except that all three dump cadences are set to the
# LATE value. The run phase (established/crossed/converged in Shells.cpp) is held in
# statics that are not persisted across a resume, and 'established' cannot re-fire late in
# the run because the pressure plateau it keys on is gone. The cadence would therefore
# fall back to itdump_early for the rest of the run -- every 2 iterations instead of every
# 500, i.e. ~5e6 extra dumps and ~30 TB.
#
# So: before resuming, check which cadence the run had actually reached (the gap between
# the highest-numbered phys*.out files in results/Last) and set all three to it. The
# values below assume the run had reached the LATE phase, cadence 500, which is the case
# once it is past the rarefaction convergence (~it 8.4e5 at this resolution).
#
# Everything else, including tstop, is unchanged, so the resumed run stops where the
# original would have.

# Run information
mode        shells          # shells / MWN
runname     cooling_g100_hires
rhoNorm     rho4
geometry    spherical       # cartesian / spherical

# Grid and sim parameters
# Nsh1: 20x the fiducial 500. Nsh4 is derived (Shells.cpp: ceil(Nsh1*D04/D01)).
Nsh1        10000
# Next: 20x, keeping the buffer resolved relative to the shell. The edge-split criterion tests
# ar = dr/dr0 > 2 against dr0 = (D01+D04)/(Nsh1+Nsh4), so leaving Next at 20 would leave the
# buffer cells 20x oversized and split them every step.
Next        400
# Endpoint by PHYSICAL time, not iteration count, so it is resolution-independent: dt ~ dx, so
# an iteration cap would have to be rescaled by hand with every Nsh1. 2.532072e7 is the lab
# time the fiducial reached at it = 850000 (results/cooling_g100/run.log).
stop        tstop
tstop       2.532072e7
# backstop only -- TSTOP_ is what ends the run. Measured: dt scales as 1/Nsh1 to 0.15%
# (t = 13.196 at it=100 here vs 264.35 in the fiducial, ratio 20.03), so reaching tstop
# takes ~1.7e7 iterations. Set well clear of that: the buffer cells split as the grid
# expands, which only ever adds iterations, and tripping the backstop would truncate a
# multi-day run silently.
itmax       40000000
# dump cadence, three phases (see Shells.cpp): dense until the shock is established over
# PLATEAU_EFRAC of the shell, then itdump, then sparse once the rarefactions have converged.
# itdump_early is the ONE cadence whose meaning does not improve with resolution: the shock
# takes 11.6 iterations to cross a cell REGARDLESS of Nsh1 (CFL ties dt to dx), so
# itdump_early = 5 gives 2.3 dumps per cell crossing at any resolution -- and that quantises
# each recorded onset by ~43% of the inter-onset interval, which is the very quantity being
# resolved here. 2 gives 5.8 dumps per crossing.
# itdump / itdump_late are left alone deliberately: their PHYSICAL time resolution already
# improves 20x for free, since 50 iterations now span 20x less time.
itdump_early 500
itdump      500
itdump_late 500

# Hydro parameters, in CGS -- IDENTICAL to the fiducial, so the two are comparable
# For shells: (Ek or rho), (D0 or ton), u, (R0 or t0)
L           1e52      # central engine kinetic power
Theta0      5e-5      # shells relativistic temperature, default 5e-5
rhoContr    5e-2      # shells to external medium density contrast, default 5e-2
u1          100
t1          1.
u4          200
t4          1.
toff        1.

# Radiative parameters
chi_sh      0.01            # shock detection threshold

# microphysics parameters
psyn       2.5              # slope of electron distribution
eps_B      0.105413         # fraction of int. energy in B field (set so log10(gma_c/gma_m) = -3 exactly, no rescaling)
eps_e      1/3              # fraction of int. energy in the acc e-
xi_e       1e-2             # accelerated electron fraction

# source parameters
z          1                # redshift
